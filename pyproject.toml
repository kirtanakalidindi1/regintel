[project]
name = "regintel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kirtanakalidindi-rice", email = "kk166@rice.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
regintel = "regintel:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
